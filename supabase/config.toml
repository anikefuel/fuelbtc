[auth.email]
enable_confirmations = false

# All repository Edge Functions are declared so the Supabase GitHub
# integration can deploy them consistently. JWT verification remains enabled
# for every privileged function during test setup. Provider webhooks will be
# opened individually only after their signature secrets are configured and
# verified.

