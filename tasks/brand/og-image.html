<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #06080A;
      font-family: 'Arial Black', 'Impact', sans-serif;
    }
    .bg-glow {
      position: absolute;
      top: -200px;
      left: -100px;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(240,185,11,0.1) 0%, transparent 65%);
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(30,42,56,0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30,42,56,0.4) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .content {
      position: relative;
      z-index: 2;
      padding: 64px 80px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo-text {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -2px;
      line-height: 1;
    }
    .logo-text .fuel { color: #F0B90B; }
    .logo-text .btc  { color: #EAECEF; }
    .tagline {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: #4C5665;
      margin-top: 8px;
    }
    .middle {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .headline {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 1.05;
      color: #EAECEF;
      max-width: 700px;
    }
    .headline .hl { color: #F0B90B; }
    .sub {
      font-family: Arial, sans-serif;
      font-size: 22px;
      color: #848E9C;
      font-weight: 400;
      margin-top: 20px;
      letter-spacing: 0;
      max-width: 580px;
      line-height: 1.5;
    }
    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stat-row {
      display: flex;
      gap: 40px;
    }
    .stat-item {}
    .stat-val {
      font-size: 26px;
      font-weight: 900;
      color: #EAECEF;
      font-family: 'Courier New', monospace;
      letter-spacing: -1px;
    }
    .stat-val span { color: #F0B90B; }
    .stat-label {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #4C5665;
      margin-top: 2px;
      letter-spacing: 0.05em;
    }
    .cta-pill {
      background: #F0B90B;
      color: #000;
      padding: 16px 36px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .right-visual {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 420px;
      opacity: 0.15;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="grid-lines"></div>

  <!-- Right side hexagon watermark -->
  <div class="right-visual">
    <svg viewBox="0 0 420 630" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%">
      <defs>
        <linearGradient id="wg" x1="0" y1="100%" x2="0" y2="0%">
          <stop offset="0%" stop-color="#F0B90B"/>
          <stop offset="55%" stop-color="#FF6B00"/>
          <stop offset="100%" stop-color="#FFD700"/>
        </linearGradient>
      </defs>
      <path d="M210 60 L380 160 L380 470 L210 570 L40 470 L40 160 Z" fill="none" stroke="#F0B90B" stroke-width="3"/>
      <path d="M240 120 L160 270 L205 270 L185 420 L280 230 L235 230 Z" fill="url(#wg)"/>
    </svg>
  </div>

  <div class="content">
    <div>
      <div class="logo-row">
        <svg width="52" height="52" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="og" x1="0" y1="100%" x2="0" y2="0%">
              <stop offset="0%" stop-color="#F0B90B"/>
              <stop offset="55%" stop-color="#FF6B00"/>
              <stop offset="100%" stop-color="#FFD700"/>
            </linearGradient>
          </defs>
          <path d="M32 2 L58 16 L58 48 L32 62 L6 48 L6 16 Z" fill="#0B0E12"/>
          <path d="M32 4 L56 17.5 L56 46.5 L32 60 L8 46.5 L8 17.5 Z" fill="none" stroke="#F0B90B" stroke-width="2"/>
          <path d="M37 10 L22 36 L31 36 L26 54 L44 28 L34 28 Z" fill="url(#og)"/>
        </svg>
        <div>
          <div class="logo-text"><span class="fuel">FUEL</span><span class="btc">BTC</span></div>
          <div class="tagline">fuelbtc.com &nbsp;·&nbsp; trade &nbsp;·&nbsp; earn &nbsp;·&nbsp; grow</div>
        </div>
      </div>
    </div>

    <div class="middle">
      <div class="headline">
        The Exchange<br>That <span class="hl">Fuels</span><br>Your Edge.
      </div>
      <div class="sub">
        Spot trading · P2P marketplace · Secure wallets.<br>
        Binance liquidity. Ultra-low fees. Instant KYC.
      </div>
    </div>

    <div class="bottom-row">
      <div class="stat-row">
        <div class="stat-item">
          <div class="stat-val">$2.4<span>B+</span></div>
          <div class="stat-label">24h Volume</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">180<span>+</span></div>
          <div class="stat-label">Assets</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">40<span>+</span></div>
          <div class="stat-label">Countries</div>
        </div>
        <div class="stat-item">
          <div class="stat-val">0.1<span>%</span></div>
          <div class="stat-label">Maker Fee</div>
        </div>
      </div>
      <div class="cta-pill">Start Trading →</div>
    </div>
  </div>
</body>
</html>
